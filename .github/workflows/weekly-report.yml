name: Haftalık Rapor E-postası

on:
  schedule:
    # Pazar 09:00 UTC = 12:00 Europe/Istanbul (UTC+3, DST yok)
    - cron: '0 9 * * 0'
  workflow_dispatch: {}   # Elle test için "Run workflow" butonu

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur
        working-directory: scripts/weekly-report
        run: npm install

      - name: Haftalık raporu gönder
        working-directory: scripts/weekly-report
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
        run: node index.mjs
